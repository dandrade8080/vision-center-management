<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BYD Vision Center | Event Requests</title>
<style>
:root{font-family:Inter,Arial,sans-serif;color:#20232b;background:#f5f6f8}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.4}.top{background:#fff;border-bottom:1px solid #ddd;padding:16px max(24px,5vw);display:flex;gap:20px;justify-content:space-between;align-items:center;flex-wrap:wrap}.brand{font-weight:900;font-size:20px}.brand b{color:#df0013}.switch{display:flex;gap:7px}.switch button,.tabs button,.ghost{padding:10px 15px;border:1px solid #ddd;background:white;border-radius:8px}.switch .active,.tabs .active{color:#d50012;background:#fff0f1;border-color:#f3c1c7}.shell{max-width:1250px;margin:32px auto;padding:0 22px}h1{font-size:30px;margin-bottom:7px}h2{font-size:21px}p,.muted{color:#656c79}.lead{margin-top:0}.card{background:white;border:1px solid #e1e3e7;border-radius:13px;padding:24px;margin:17px 0}.primary{background:#df0013;color:white;border:0;padding:12px 18px;border-radius:8px;font-weight:700}.row{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.metric{padding:17px;background:white;border-radius:12px;border:1px solid #e1e3e7}.metric strong{display:block;font-size:28px;margin-top:6px}.field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700}.field input,.field select,.field textarea,select.filter{width:100%;padding:11px;border:1px solid #ccd0d7;border-radius:7px;background:#fff}.field textarea{min-height:84px}.wide{grid-column:1/-1}.checks{display:flex;flex-wrap:wrap;gap:9px}.checks label{font-weight:500;padding:10px;border:1px solid #dde0e4;border-radius:8px}.checks input{margin-right:6px}.notice{background:#fff7eb;border-left:4px solid #d68c11;padding:13px;border-radius:5px;margin:16px 0}.steps{display:flex;flex-wrap:wrap;gap:7px;margin:16px 0}.steps span{padding:8px 12px;background:#e8e9ec;border-radius:20px;font-size:12px}.steps .active{background:#df0013;color:white}.actions{display:flex;justify-content:space-between;margin-top:24px;gap:10px}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.day{border:1px solid #e1e3e7;padding:9px;text-align:left;min-height:72px;background:#fff;border-radius:6px;position:relative}.day small{display:block;font-weight:800}.day.off{color:#a7aab1;background:repeating-linear-gradient(135deg,#f7f7f8,#f7f7f8 8px,#ebedf0 8px,#ebedf0 9px);text-decoration:line-through}.day.selected{outline:2px solid #d50012}.day .dots{font-size:12px;color:#d50012}.tablewrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:12px;border-bottom:1px solid #e8eaed;text-align:left;vertical-align:top}.pill{padding:5px 9px;display:inline-block;border:1px solid #ddd;border-radius:20px;font-size:11px;white-space:nowrap}.bad{color:#b00020}.ok{color:#09734c}.slots{display:grid;grid-template-columns:95px repeat(5,minmax(130px,1fr));overflow:auto}.slot{border:1px solid #e8e8e8;padding:10px;min-height:55px;min-width:120px;font-size:12px}.slot.head{background:#f3f4f5;font-weight:bold}.eventchip{display:block;text-align:left;border:1px solid #ddd;background:#fff;border-left:5px solid #b60010;border-radius:6px;padding:7px;width:100%;margin:2px 0;font-size:11px}.eventchip .symbol{font-size:16px;margin-right:4px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.hidden{display:none!important}.caption{font-size:12px;color:#777}.summary{white-space:pre-wrap;line-height:1.75}.result{max-width:660px;margin:65px auto;text-align:center}.space0{border-left-color:#e00012}.space1{border-left-color:#417bca}.space2{border-left-color:#8f52ae}.space3{border-left-color:#158268}.space4{border-left-color:#d18922}@media(max-width:780px){.metrics{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.calendar .day{padding:5px;min-height:57px}.top{padding:15px}.shell{margin:15px auto;padding:0 12px}.card{padding:16px}.calendar{gap:2px}.slots{grid-template-columns:85px repeat(5,125px)}} 
</style></head>
<body><div class="top"><div class="brand"><b>BYD</b> VISION CENTER <span class="caption"> · Event Management</span></div><div class="switch"><button id="requesterMode" class="active" onclick="mode('requester')">Requester Portal</button><button id="managerMode" onclick="mode('manager')">Vision Center Management</button></div></div><main id="app" class="shell"></main>
<script>
const SPACES=['VIP Space','Mezzanine','Plenary + Studio','Gourmet Deck','Lounge Area'];const STATUSES=['Requested','Under review','Tentatively scheduled','Confirmed','Rejected','Cancelled'];const OPS=['Not started','Upcoming','In progress','Completed'];const KEY='byd-vc-demo-events-v2';let modeName='requester',tab='dashboard',step=0,selected='',month=new Date();month.setDate(1);let current=null;let f={spaces:[],needs:[],coverage:[],capture:[],deliverables:[],platforms:[]};
const getEvents=()=>{try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch{return []}},saveEvents=a=>localStorage.setItem(KEY,JSON.stringify(a));
const el=()=>document.getElementById('app'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10),today=()=>iso(new Date()),minDate=()=>{let d=new Date();d.setDate(d.getDate()+20);return iso(d)},nice=s=>s?new Date(s+'T12:00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}):'—';
const color=i=>'space'+(i<0?0:i),symbol=s=>s==='Tentatively scheduled'?'○':s==='Confirmed'?'✓':s==='Cancelled'?'×':s==='Rejected'?'×':'•';
const check=(name,items)=>'<div class="checks">'+items.map(x=>'<label><input type="checkbox" name="'+name+'" value="'+esc(x)+'" '+((f[name]||[]).includes(x)?'checked':'')+'>'+esc(x)+'</label>').join('')+'</div>';
const field=(label,name,type='text',options)=>'<label class="field">'+label+(options?'<select name="'+name+'">'+options.map(o=>'<option value="'+esc(o)+'" '+(f[name]===o?'selected':'')+'>'+esc(o)+'</option>').join('')+'</select>':type==='textarea'?'<textarea name="'+name+'">'+esc(f[name]||'')+'</textarea>':'<input name="'+name+'" type="'+type+'" value="'+esc(f[name]||'')+'" '+(type==='date'?'min="'+minDate()+'"':'')+'>')+'</label>';
function mode(m){modeName=m;document.getElementById('requesterMode').classList.toggle('active',m==='requester');document.getElementById('managerMode').classList.toggle('active',m==='manager');tab='dashboard';render()}
function render(){if(modeName==='requester')requester();else manager()}
function requester(){let x='<h1>Request an event</h1><p class="lead">Tell us what you need. Our team will check feasibility and confirm details with you.</p><div class="notice"><b>A request is not a reservation.</b> Dates shown as eligible can be requested but are not automatically booked. Requests must be made at least 20 days ahead.</div>';if(tab==='submitted'){const e=getEvents().find(z=>z.id===current);el().innerHTML='<div class="card result"><h1>✓ Request registered</h1><p>Reference <b>'+esc(current)+'</b></p><p>Your event request has been received for Vision Center review. Submission does not confirm the event.</p><button class="primary" onclick="newRequest()">New request</button></div>';return}if(tab==='request'){el().innerHTML=x+wizard();bindForm();return}el().innerHTML=x+'<div class="card"><div class="row"><h2>Select your preferred date</h2><button class="primary" onclick="tab=\'request\';render()">Start event request</button></div>'+calendar(true)+'<p class="caption">Striped dates cannot be requested. A date with events may still accept an inquiry; the Vision Center team determines availability.</p></div>'; }
function calendar(requestMode=false){let y=month.getFullYear(),m=month.getMonth(),first=new Date(y,m,1).getDay(),last=new Date(y,m+1,0).getDate(),out='<div class="row"><button class="ghost" onclick="moveMonth(-1)">‹ Previous</button><h3>'+month.toLocaleDateString('en-US',{month:'long',year:'numeric'})+'</h3><button class="ghost" onclick="moveMonth(1)">Next ›</button></div><div class="calendar">';['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach(d=>out+='<div class="caption">'+d+'</div>');for(let i=0;i<first;i++)out+='<div></div>';const all=getEvents();for(let d=1;d<=last;d++){const date=iso(new Date(y,m,d)),off=requestMode&&date<minDate(),n=all.filter(e=>e.date===date&& !['Cancelled','Rejected'].includes(e.status)).length;out+='<button type="button" class="day '+(off?'off ':'')+(selected===date?'selected':'')+'" '+(off?'disabled':'')+' onclick="'+(requestMode?'pickDate':'pickManagerDate')+'(\''+date+'\')"><small>'+d+'</small>'+(n?'<span class="dots">'+n+' event(s)</span>':'')+'</button>'}return out+'</div>'}
function moveMonth(n){month.setMonth(month.getMonth()+n);render()}function pickDate(d){selected=d;f.date=d;tab='request';step=0;render()}function pickManagerDate(d){selected=d;tab='day';render()}
function newRequest(){f={spaces:[],needs:[],coverage:[],capture:[],deliverables:[],platforms:[]};step=0;selected='';month=new Date();month.setDate(1);tab='dashboard';render()}
function wizard(){let labels=['Contact','Event','Date & spaces','Needs','Review'];let html='<div class="card"><div class="steps">'+labels.map((s,i)=>'<span class="'+(step===i?'active':'')+'">'+(i+1)+'. '+s+'</span>').join('')+'</div><form id="requestForm"><div class="grid">';
if(step===0)html+=field('Full name *','name')+field('Business email *','email','email')+field('WhatsApp / phone','phone')+field('Internal or external request','origin','text',['Internal','External'])+field('Company / business unit','company')+field('Role / department','role');
if(step===1)html+=field('Event name *','event')+field('Event type','type','text',['Customer event','Internal event','Partner event','Training / Workshop','Visit / Experience','Recording / Content','Other'])+field('Estimated attendees','attendees','number')+field('Audience','audience')+'<div class="wide">'+field('Objective / event description','details','textarea')+'</div>';
if(step===2)html+=field('Preferred date *','date','date')+field('Alternative date','alternative','date')+field('Start time *','starttime','time')+field('End time *','endtime','time')+'<div class="wide"><h3>Preferred spaces</h3>'+check('spaces',SPACES)+'<p class="caption">Space selection is a preference, not a booking.</p></div>';
if(step===3)html+='<div class="wide"><h3>Event needs</h3>'+check('needs',['Catering','Screen / presentation','Speakers','External guests','Photo / Video / AV','Live streaming','Transport','Accessibility support','Other'])+'</div><div class="wide" id="avarea"></div>'+field('Additional requirements','special','textarea')+field('Will you have an event agency?','agency','text',['Not sure','Yes','No']);
if(step===4)html+='<div class="wide"><h2>Review your request</h2><div class="notice">Submitting this request does not reserve your preferred date or spaces.</div><div class="summary">'+Object.entries({Requester:f.name,Email:f.email,Event:f.event,Type:f.type,Date:nice(f.date),Time:(f.starttime||'—')+' – '+(f.endtime||'—'),Spaces:(f.spaces||[]).join(', '),Needs:(f.needs||[]).join(', '),'AV coverage':(f.coverage||[]).join(', '),Details:f.details}).map(([k,v])=>'<b>'+esc(k)+':</b> '+esc(v||'—')).join('<br>')+'</div></div>';
html+='</div><div class="actions"><button class="ghost" type="button" onclick="previous()">'+(step===0?'Cancel':'Back')+'</button><button class="primary" type="button" onclick="advance()">'+(step===4?'Submit request':'Continue')+'</button></div></form></div>';return html}
function bindForm(){const form=document.getElementById('requestForm');if(!form)return;form.addEventListener('input',collect);form.addEventListener('change',()=>{collect();if(step===3)updateAV()});if(step===3)updateAV()}
function collect(){let form=document.getElementById('requestForm');if(!form)return;const data=new FormData(form);for(const [k,v] of data.entries())if(!['spaces','needs','coverage','capture','deliverables','platforms'].includes(k))f[k]=v;for(const k of ['spaces','needs','coverage','capture','deliverables','platforms'])if(form.querySelector('[name="'+k+'"]'))f[k]=data.getAll(k)}
function updateAV(){let area=document.getElementById('avarea');if(!area)return;if(!(f.needs||[]).some(x=>/AV|streaming/.test(x))){area.innerHTML='';return}let showVideo=(f.coverage||[]).includes('Video')||(f.coverage||[]).includes('Live streaming')||(f.needs||[]).includes('Live streaming');area.innerHTML='<div class="notice"><b>Audiovisual briefing</b><p>Describe the results you want. Our team will determine crew, cameras, audio and equipment.</p></div><div class="grid"><div class="wide"><b>Coverage required</b>'+check('coverage',['Photography','Video','Live streaming','Not sure'])+'</div>'+field('Main purpose','avpurpose','text',['Not sure','Institutional record','Social media','Press','Advertising / campaign','Internal communication','Other'])+'<div class="wide"><b>What should be captured?</b>'+check('capture',['Stage / presentations','Guests','Product / vehicle','Interviews','Activities','Behind the scenes'])+'</div><div class="wide"><b>Expected content</b>'+check('deliverables',['Edited photos','Main video / aftermovie','Short vertical videos','Interviews','Full presentations','Raw footage'])+'</div><div class="wide"><b>Where will content be used?</b>'+check('platforms',['Instagram','TikTok','YouTube','LinkedIn','Press','Internal'])+'</div>'+field('Content needed during event?','realtime','text',['Not sure','No','Photos','Videos','Live publishing'])+field('Delivery deadline','deadline','text',['No specific deadline','Same day','Next day','Within 3 days','Within 1 week','Other'])+field('Key moments not to miss','moments','textarea')+field('People/products/messages to feature','must','textarea')+field('Restrictions on filming','restrictions','textarea')+field('Will there be minors?','minors','text',['Not sure','No','Yes'])+field('Image-use permissions handled?','releases','text',['Not sure','Yes','No','Need guidance'])+field('Scripts / references (URL)','references')+(showVideo?field('Live stream destination (if applicable)','streamdestination'):'')+'</div>';area.querySelectorAll('input,select,textarea').forEach(e=>{e.addEventListener('change',()=>{collect();if(e.name==='coverage')updateAV()});e.addEventListener('input',collect)})}
function previous(){collect();if(step===0){tab='dashboard'}else step--;render()}
function advance(){collect();if(step===0&&(!f.name||!/^\S+@\S+\.\S+$/.test(f.email||''))){alert('Enter your name and a valid email.');return}if(step===1&&!f.event){alert('Enter an event name.');return}if(step===2){if(!f.date||f.date<minDate()){alert('Choose a date at least 20 days from today.');return}if(!f.starttime||!f.endtime||f.endtime<=f.starttime){alert('Choose a valid start and end time.');return}if(!(f.spaces||[]).length){alert('Select at least one preferred space.');return}}if(step<4){step++;render();return}const e={...f,id:'VC-'+Date.now().toString(36).toUpperCase(),status:'Requested',operational:'Not started',owner:'Vision Center Team',createdAt:new Date().toISOString(),history:[{at:new Date().toISOString(),text:'Request submitted'}]};saveEvents([...getEvents(),e]);current=e.id;tab='submitted';render()}
function manager(){const es=getEvents();if(tab==='detail'){detail();return}let nav='<div class="tabs">'+[['dashboard','Dashboard'],['calendar','Calendar'],['day','Space schedule'],['events','All events']].map(([id,t])=>'<button class="'+(tab===id?'active':'')+'" onclick="tab=\''+id+'\';render()">'+t+'</button>').join('')+'</div>';let top='<h1>Vision Center Management</h1><p class="lead">Review requests, manage events and monitor spaces. <b>Prototype:</b> manager mode is a demonstration, not authenticated access.</p>'+nav;if(tab==='dashboard'){const counts=[['Requested / Under review',es.filter(e=>['Requested','Under review'].includes(e.status)).length],['Tentatively scheduled',es.filter(e=>e.status==='Tentatively scheduled').length],['Confirmed',es.filter(e=>e.status==='Confirmed').length],['In progress',es.filter(e=>e.operational==='In progress').length],['Completed',es.filter(e=>e.operational==='Completed').length]];const next=es.filter(e=>e.date>=today()&&e.status==='Confirmed').sort((a,b)=>a.date.localeCompare(b.date))[0];el().innerHTML=top+'<div class="metrics">'+counts.map(([name,n])=>'<div class="metric"><span>'+name+'</span><strong>'+n+'</strong></div>').join('')+'</div><div class="card"><h2>Next confirmed event</h2><p>'+(next?esc(next.event)+' · '+nice(next.date)+' · '+esc(next.starttime)+' · '+esc((next.spaces||[]).join(', ')):'No upcoming confirmed events')+'</p></div><div class="card"><h2>Needs review</h2>'+eventTable(es.filter(e=>['Requested','Under review'].includes(e.status)))+'</div>';return}
if(tab==='calendar'){el().innerHTML=top+'<div class="card"><h2>Calendar</h2>'+calendar(false)+'</div><div class="card"><h3>Space key</h3>'+SPACES.map((s,i)=>'<span class="eventchip '+color(i)+'" style="display:inline-block;width:auto;margin:5px">'+s+'</span>').join('')+'<p class="caption">○ Tentatively scheduled &nbsp; ✓ Confirmed &nbsp; • Requested / under review</p></div>';return}
if(tab==='day'){let date=selected||today();let html='<div class="row"><h2>Spaces · '+nice(date)+'</h2><label class="field">Date<input type="date" value="'+date+'" onchange="selected=this.value;render()"></label></div><div class="tablewrap"><div class="slots"><div class="slot head">Time</div>'+SPACES.map(s=>'<div class="slot head">'+s+'</div>').join('');for(let h=7;h<=22;h++){html+='<div class="slot head">'+String(h).padStart(2,'0')+':00</div>';for(const [i,space] of SPACES.entries()){const occupying=es.filter(e=>e.date===date&&(e.spaces||[]).includes(space)&&e.starttime&&e.endtime&&parseInt(e.starttime)<=h&&parseInt(e.endtime)>h&&!['Rejected','Cancelled'].includes(e.status));html+='<div class="slot">'+occupying.map(e=>chip(e,i)).join('')+'</div>'}}html+='</div></div>';el().innerHTML=top+'<div class="card">'+html+'</div>';return}
el().innerHTML=top+'<div class="card"><div class="row"><h2>All events</h2><span class="caption">'+es.length+' requests / events</span></div><div class="grid"><label class="field">Search<input id="search" placeholder="Event, requester, business unit"></label><label class="field">Status<select id="statusFilter"><option value="">All statuses</option>'+STATUSES.map(s=>'<option>'+s+'</option>').join('')+'</select></label><label class="field">Space<select id="spaceFilter"><option value="">All spaces</option>'+SPACES.map(s=>'<option>'+s+'</option>').join('')+'</select></label><label class="field">Type<select id="typeFilter"><option value="">All types</option>'+[...new Set(es.map(e=>e.type).filter(Boolean))].map(s=>'<option>'+esc(s)+'</option>').join('')+'</select></label></div><div id="results">'+eventTable(es)+'</div></div>';['search','statusFilter','spaceFilter','typeFilter'].forEach(id=>document.getElementById(id).addEventListener('input',filterEvents))}
function chip(e,i){return '<button class="eventchip '+color(i)+'" onclick="openEvent(\''+e.id+'\')"><span class="symbol">'+symbol(e.status)+'</span>'+esc(e.event)+'<br>'+esc(e.status)+'</button>'}
function eventTable(es){if(!es.length)return '<p>No events found. Requests submitted in this browser will appear here.</p>';return '<div class="tablewrap"><table><thead><tr><th>Event</th><th>Date / time</th><th>Spaces</th><th>Requester</th><th>Request status</th><th>Operational</th></tr></thead><tbody>'+es.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(e=>'<tr><td><button class="ghost" onclick="openEvent(\''+e.id+'\')">'+esc(e.event)+'</button></td><td>'+nice(e.date)+'<br>'+esc(e.starttime||'')+'–'+esc(e.endtime||'')+'</td><td>'+esc((e.spaces||[]).join(', '))+'</td><td>'+esc(e.name)+'<br>'+esc(e.company||'')+'</td><td><span class="pill">'+symbol(e.status)+' '+esc(e.status)+'</span></td><td>'+esc(e.operational)+'</td></tr>').join('')+'</tbody></table></div>'}
function filterEvents(){const es=getEvents(),q=document.getElementById('search').value.toLowerCase(),s=document.getElementById('statusFilter').value,sp=document.getElementById('spaceFilter').value,t=document.getElementById('typeFilter').value;document.getElementById('results').innerHTML=eventTable(es.filter(e=>([e.event,e.name,e.company].join(' ').toLowerCase().includes(q))&&(!s||e.status===s)&&(!sp||(e.spaces||[]).includes(sp))&&(!t||e.type===t)))}
function openEvent(id){current=id;tab='detail';render()}
function detail(){const e=getEvents().find(x=>x.id===current);if(!e){tab='events';render();return}const rows={Reference:e.id,Event:e.event,Requester:e.name,Email:e.email,Phone:e.phone,'Company / BU':e.company,'Event type':e.type,Date:nice(e.date),Alternative:nice(e.alternative),Time:(e.starttime||'')+'–'+(e.endtime||''),Spaces:(e.spaces||[]).join(', '),Attendees:e.attendees,Needs:(e.needs||[]).join(', '),'AV coverage':(e.coverage||[]).join(', '),'Content purpose':e.avpurpose,'Expected content':(e.deliverables||[]).join(', '),'Key moments':e.moments,Restrictions:e.restrictions,Description:e.details,'Special requirements':e.special};el().innerHTML='<button class="ghost" onclick="tab=\'events\';render()">← Events</button><div class="card"><h1>'+esc(e.event)+'</h1><div class="grid"><label class="field">Request status<select id="reqstatus">'+STATUSES.map(s=>'<option '+(e.status===s?'selected':'')+'>'+s+'</option>').join('')+'</select></label><label class="field">Operational status<select id="opstatus">'+OPS.map(s=>'<option '+(e.operational===s?'selected':'')+'>'+s+'</option>').join('')+'</select></label><label class="field wide">Internal notes<textarea id="notes">'+esc(e.notes||'')+'</textarea></label></div><button class="primary" onclick="saveChanges()">Save changes</button><h2>Request details</h2><div class="summary">'+Object.entries(rows).map(([k,v])=>'<b>'+esc(k)+':</b> '+esc(v||'—')).join('<br>')+'</div><h2>History</h2>'+(e.history||[]).map(h=>'<p>'+esc(h.at)+' — '+esc(h.text)+'</p>').join('')+'</div>'}
function saveChanges(){let es=getEvents(),e=es.find(x=>x.id===current),s=document.getElementById('reqstatus').value,op=document.getElementById('opstatus').value;if(op!=='Not started'&&s!=='Confirmed'){alert('Operational status can only advance for confirmed events.');return}if((s==='Rejected'||s==='Cancelled')&&op!=='Not started'){alert('Reset operational status before rejecting or cancelling.');return}const changes=[];if(s!==e.status)changes.push(e.status+' → '+s);if(op!==e.operational)changes.push(e.operational+' → '+op);e.status=s;e.operational=op;e.notes=document.getElementById('notes').value;if(changes.length)e.history.push({at:new Date().toISOString(),text:changes.join('; ')});saveEvents(es);render()}
render();
</script></body></html>

function calendarBind(){document.getElementById('prevMonth').onclick=()=>{month.setMonth(month.getMonth()-1);render()};document.getElementById('nextMonth').onclick=()=>{month.setMonth(month.getMonth()+1);render()};document.querySelectorAll('[data-date]').forEach(e=>e.onclick=()=>{selected=e.dataset.date;form.date=selected;step=0;page='wizard';render()})}
function requestPage(){const app=document.getElementById('app');if(page==='done'){app.innerHTML='<div class="card center"><h1 class="good">✓ '+t('success')+'</h1><h2>'+t('reference')+': '+htmlEscape(selectedEvent?.reference||'')+'</h2><p>'+t('successDesc')+'</p><button class="primary" id="newReq">'+t('request')+'</button></div>';document.getElementById('newReq').onclick=()=>{form={spaces:[],needs:[],coverage:[],capture:[],deliverables:[],platforms:[]};page='request';render()};return}
if(page==='request'){app.innerHTML='<h1>'+t('title')+'</h1><div class="request-layout"><aside class="request-guide"><h2>'+t('processTitle')+'</h2><p>'+t('intro')+'</p><ol><li>'+t('process1')+'</li><li>'+t('process2')+'</li><li>'+t('process3')+'</li></ol><div class="notice">'+t('disclaimer')+'</div></aside><section class="card compact-calendar"><h2>'+t('selectDate')+'</h2>'+calendar()+'<p class="hint">'+t('invalidDate')+'</p><button class="primary" id="startReq">'+t('start')+'</button></section></div>';calendarBind();document.getElementById('startReq').onclick=()=>{page='wizard';step=0;render()};return}
app.innerHTML='<h1>'+t('title')+'</h1><div class="notice">'+t('disclaimer')+'</div><div class="card"><div class="stepnav">'+t('steps').map((x,i)=>'<span class="'+(i===step?'active':'')+'">'+(i+1)+'. '+x+'</span>').join('')+'</div><form id="eventForm"><div class="cols">'+wizardFields()+'</div><div class="actions"><button type="button" class="outline" id="back">'+t('back')+'</button><button type="button" class="primary" id="forward">'+(step===4?t('send'):t('next'))+'</button></div></form></div>';
const node=document.getElementById('eventForm');node.addEventListener('input',capture);node.addEventListener('change',()=>{capture();if(step===3){avRender();agencyRender()}if(step===2)setupRender()});document.getElementById('back').onclick=()=>{capture();if(step===0)page='request';else step--;render()};document.getElementById('forward').onclick=advance;if(step===3){avRender();agencyRender()}if(step===2)setupRender()}
function wizardFields(){if(step===0)return field(t('name')+' *','name')+field(t('email')+' *','email','email')+field(t('phone'),'phone')+field(t('origin'),'origin','text',['Internal','External'])+field(t('company'),'company')+field(t('role'),'role');
if(step===1)return field(t('event')+' *','event')+field(t('type'),'type','text',['Customer event','Internal event','Partner event','Training / Workshop','Visit / Experience','Recording / Content','Other'])+field(t('attendees'),'attendees','number')+field(t('audience'),'audience')+'<div class="all">'+field(t('details'),'details','textarea')+'</div>';
if(step===2)return field(t('date')+' *','date','date')+field(t('alternate'),'alternate','date')+field(t('starttime')+' *','starttime','time')+field(t('endtime')+' *','endtime','time')+'<div class="all"><h3>'+t('setupQuestion')+'</h3>'+field(t('setupQuestion'),'setupNeeded','text',['No','Yes'])+'<div id="setupArea"></div></div><div class="all"><h3>'+t('spaces')+' *</h3>'+checks('spaces',SPACES)+'</div>';
if(step===3)return '<div class="all"><h3>'+t('needs')+'</h3>'+checks('needs',['Catering','Screen / presentation','Photo / Video / AV','Other'])+'</div><div class="all" id="avArea"></div>'+field(t('special'),'special','textarea')+'<div class="all">'+field(t('agency'),'agency','text',['Not sure','Yes','No'])+'<div id="agencyMessage"></div></div>';
return '<div class="all"><h2>'+t('review')+'</h2><div class="notice">'+t('disclaimer')+'</div><div class="summary">'+Object.entries({[t('name')]:form.name,[t('email')]:form.email,[t('event')]:form.event,[t('date')]:fmt(form.date),[t('starttime')]:form.starttime,[t('endtime')]:form.endtime,[t('spaces')]:(form.spaces||[]).join(', '),[t('setupQuestion')]:optionText(form.setupNeeded||'No'),[t('setupDate')]:form.setupNeeded==='Yes'?fmt(form.setupDate):'—',[t('teardownDate')]:form.setupNeeded==='Yes'?fmt(form.teardownDate):'—',[t('agency')]:optionText(form.agency||'Not sure'),[t('needs')]:(form.needs||[]).join(', '),[t('coverage')]:(form.coverage||[]).join(', ')}).map(([k,v])=>'<b>'+htmlEscape(k)+':</b> '+htmlEscape(v||'—')+'<br>').join('')+'</div></div>'}
function setupRender(){const el=document.getElementById('setupArea');if(!el)return;el.innerHTML=form.setupNeeded==='Yes'?'<p class="hint">'+t('setupHint')+'</p><div class="cols">'+extraDate(t('setupDate'),'setupDate')+extraDate(t('teardownDate'),'teardownDate')+'</div>':''}
function agencyRender(){const el=document.getElementById('agencyMessage');if(el)el.innerHTML=form.agency==='No'?'<div class="notice">'+t('agencyHelp')+'</div>':''}
function avRender(){const target=document.getElementById('avArea');if(!target)return;if(!(form.needs||[]).some(n=>/AV|streaming/.test(n))){target.innerHTML='';return}let stream=(form.coverage||[]).includes('Live streaming')||(form.needs||[]).includes('Live streaming');target.innerHTML='<div class="notice"><strong>'+t('avtitle')+'</strong><p>'+t('avintro')+'</p></div><div class="cols"><div class="all"><b>'+t('coverage')+'</b>'+checks('coverage',['Photography','Video','Live streaming','Not sure'])+'</div>'+field(t('purpose'),'purpose','text',['Not sure','Institutional record','Social media','Press','Advertising','Internal','Other'])+'<div class="all"><b>'+t('capture')+'</b>'+checks('capture',['Stage / presentations','Guests','Product / vehicle','Interviews','Experience','Behind the scenes'])+'</div><div class="all"><b>'+t('deliverables')+'</b>'+checks('deliverables',['Edited photos','Main video / aftermovie','Vertical videos','Interviews','Full presentations','Raw footage'])+'</div><div class="all"><b>'+t('platforms')+'</b>'+checks('platforms',['Instagram','TikTok','YouTube','LinkedIn','Press','Internal'])+'</div>'+field(t('realtime'),'realtime','text',['Not sure','No','Photos','Videos','Live publishing'])+field(t('deadline'),'deadline','text',['No specific deadline','Same day','Next day','Within 3 days','Within 1 week','Other'])+field(t('moments'),'moments','textarea')+field(t('must'),'must','textarea')+field(t('restrictions'),'restrictions','textarea')+field(t('minors'),'minors','text',['Not sure','No','Yes'])+field(t('releases'),'releases','text',['Not sure','Yes','No','Need guidance'])+field(t('references'),'references')+(stream?field(t('streamdestination'),'streamdestination'):'')+'</div>';target.querySelectorAll('input,select,textarea').forEach(n=>{n.addEventListener('input',capture);n.addEventListener('change',()=>{capture();if(n.name==='coverage')avRender()})})}
async function advance(){capture();if(step===0&&(!form.name?.trim()||!(/^\S+@\S+\.\S+$/.test(form.email||''))))return alert(t('required'));if(step===1&&!form.event?.trim())return alert(t('required'));if(step===2&&(!form.date||form.date<minDate()||!form.starttime||!form.endtime||form.endtime<=form.starttime||!form.spaces?.length))return alert(t('required'));if(step===2&&form.setupNeeded==='Yes'&&(!form.setupDate||!form.teardownDate||form.setupDate>form.date||form.teardownDate<form.date))return alert(t('setupError'));if(step<4){step++;render();return}if(!ready)return alert(t('notReady'));const reference='VC-'+crypto.randomUUID().replaceAll('-','').slice(0,10).toUpperCase();const payload={reference,requester_name:form.name.trim(),requester_email:form.email.trim(),requester_phone:form.phone||null,requester_origin:form.origin||'Internal',company_unit:form.company||null,event_name:form.event.trim(),event_type:form.type||null,event_description:form.details||null,estimated_attendees:form.attendees?Number(form.attendees):null,audience:form.audience||null,event_date:form.date,alternate_date:form.alternate||null,start_time:form.starttime,end_time:form.endtime,space_ids:form.spaces||[],needs:form.needs||[],special_requirements:form.special||null,agency:form.agency||null,setup_needed:form.setupNeeded==='Yes',setup_date:form.setupNeeded==='Yes'?form.setupDate:null,teardown_date:form.setupNeeded==='Yes'?form.teardownDate:null,av_brief:{coverage:form.coverage||[],purpose:form.purpose,capture:form.capture||[],deliverables:form.deliverables||[],platforms:form.platforms||[],realtime:form.realtime,deadline:form.deadline,moments:form.moments,must:form.must,restrictions:form.restrictions,minors:form.minors,releases:form.releases,references:form.references,streamdestination:form.streamdestination}};const button=document.getElementById('forward');button.disabled=true;const {error}=await db.from('event_requests').insert(payload);button.disabled=false;if(error){alert(t('error')+' '+error.message);return}selectedEvent={reference};page='done';render()}
async function loginPage(){
const app=document.getElementById('app');
const label=lang==='pt'?'Código de acesso':lang==='zh'?'管理访问码':'Access code';
const desc=lang==='pt'?'Acesso restrito aos gestores autorizados. Informe o código de acesso para consultar e administrar eventos.':lang==='zh'?'仅限授权管理人员。请输入访问码。':'Authorized managers only. Enter the access code to manage events.';
app.innerHTML='<div class="card login"><h1>'+t('login')+'</h1><p>'+desc+'</p>'+(!ready?'<div class="notice">'+t('notReady')+'</div>':'')+'<form id="loginForm" class="cols"><label class="field all">'+label+'<input name="accessCode" type="password" autocomplete="off" required></label><div class="all"><button class="primary" '+(!ready?'disabled':'')+'>'+t('signIn')+'</button></div></form><p id="loginError" class="danger"></p></div>';
document.getElementById('loginForm').onsubmit=async e=>{
  e.preventDefault();const code=new FormData(e.target).get('accessCode');
  const b=e.target.querySelector('button');b.disabled=true;
  try{
    const {data,error}=await db.rpc('vc_management_check',{p_code:code});
    if(error)throw error;
    if(data!==true){document.getElementById('loginError').textContent=lang==='pt'?'Código inválido.':'Invalid access code.';return}
    accessCode=code;isManager=true;await loadEvents();managerTab='dashboard';managerPage();
  }catch(err){document.getElementById('loginError').textContent=(lang==='pt'?'Acesso ainda não configurado ou indisponível. ':'Access unavailable. ')+err.message}
  finally{b.disabled=false}
};
}
async function loadEvents(){
if(!isManager||!accessCode)return;
const {data,error}=await db.rpc('vc_management_list',{p_code:accessCode});
if(error){alert(t('error')+' '+error.message);return}
if(data===null){isManager=false;accessCode='';loginPage();return}
events=Array.isArray(data)?data:[];
}
const stSymbol=s=>s==='Tentatively scheduled'?'○':s==='Confirmed'?'✓':s==='Cancelled'?'×':'•';
const dateToday=()=>dateISO(new Date());
function chip(e,i){return '<button class="event space'+i+'" data-open="'+e.id+'">'+stSymbol(e.request_status)+' '+htmlEscape(e.event_name)+'<br>'+htmlEscape(e.request_status)+'</button>'}
function eventTable(rows){return rows.length?'<div class="tableScroll"><table><thead><tr><th>Evento</th><th>Data</th><th>Espaços</th><th>Solicitante</th><th>Status</th><th>Execução</th></tr></thead><tbody>'+rows.map(e=>'<tr><td><button class="outline" data-open="'+e.id+'">'+htmlEscape(e.event_name)+'</button></td><td>'+fmt(e.event_date)+'<br>'+htmlEscape(e.start_time)+'</td><td>'+htmlEscape((e.space_ids||[]).join(', '))+'</td><td>'+htmlEscape(e.requester_name)+'</td><td><span class="badge">'+stSymbol(e.request_status)+' '+htmlEscape(e.request_status)+'</span></td><td>'+htmlEscape(e.operational_status)+'</td></tr>').join('')+'</tbody></table></div>':'<p>'+t('noEvents')+'</p>'}
function managerPage(){const app=document.getElementById('app');if(!isManager){loginPage();return}const nav='<div class="tabs">'+[['dashboard',t('dashboard')],['calendar',t('calendar')],['schedule',t('schedule')],['events',t('all')]].map(([key,label])=>'<button data-tab="'+key+'" class="'+(managerTab===key?'active':'')+'">'+label+'</button>').join('')+'<button id="logout" class="outline">'+t('signOut')+'</button></div>';let inner='';
if(managerTab==='dashboard'){const stats=[[t('pending'),events.filter(x=>['Requested','Under review'].includes(x.request_status)).length],[t('tentative'),events.filter(x=>x.request_status==='Tentatively scheduled').length],[t('confirmed'),events.filter(x=>x.request_status==='Confirmed').length],[t('completed'),events.filter(x=>x.operational_status==='Completed').length]];const next=events.find(x=>x.event_date>=dateToday()&&x.request_status==='Confirmed');inner='<div class="metrics">'+stats.map(([name,n])=>'<div class="metric">'+name+'<strong>'+n+'</strong></div>').join('')+'</div><div class="card"><h2>'+t('nextEvent')+'</h2><p>'+(next?htmlEscape(next.event_name)+' · '+fmt(next.event_date)+' · '+htmlEscape(next.space_ids.join(', ')):t('noEvents'))+'</p></div><div class="card"><h2>'+t('pending')+'</h2>'+eventTable(events.filter(x=>['Requested','Under review'].includes(x.request_status)))+'</div>'}
if(managerTab==='events')inner='<div class="card"><div class="cols"><label class="field">'+t('filter')+'<input id="filterText"></label><label class="field">'+t('statusFilter')+'<select id="filterStatus"><option value="">'+t('allStatuses')+'</option>'+STATUS.map(s=>'<option>'+s+'</option>').join('')+'</select></label></div><div id="eventResults">'+eventTable(events)+'</div></div>';
if(managerTab==='calendar'){let mm=month,first=new Date(mm.getFullYear(),mm.getMonth(),1).getDay(),days=new Date(mm.getFullYear(),mm.getMonth()+1,0).getDate(),cal='<div class="row"><button class="outline" id="mPrev">‹</button><h2>'+mm.toLocaleDateString(lang==='pt'?'pt-BR':'en-US',{month:'long',year:'numeric'})+'</h2><button class="outline" id="mNext">›</button></div><div class="calendar">';['D','S','T','Q','Q','S','S'].forEach(k=>cal+='<span>'+k+'</span>');for(let i=0;i<first;i++)cal+='<span></span>';for(let d=1;d<=days;d++){let day=dateISO(new Date(mm.getFullYear(),mm.getMonth(),d)),n=events.filter(e=>e.event_date===day&&!['Cancelled','Rejected'].includes(e.request_status)).length;cal+='<button class="day" data-day="'+day+'">'+d+(n?'<br><small>'+n+' evento(s)</small>':'')+'</button>'}inner='<div class="card">'+cal+'</div></div><p class="hint">○ '+t('tentative')+' · ✓ '+t('confirmed')+'</p>'}
if(managerTab==='schedule'){let d=selected||dateToday();inner='<div class="card"><div class="row"><h2>'+t('schedule')+'</h2><label class="field">'+t('day')+'<input id="scheduleDate" type="date" value="'+d+'"></label></div><div class="tableScroll"><div class="spaces"><div class="slot head">Hora</div>'+SPACES.map(s=>'<div class="slot head">'+s+'</div>').join('');for(let h=7;h<=22;h++){inner+='<div class="slot head">'+String(h).padStart(2,'0')+':00</div>';SPACES.forEach((s,i)=>{const es=events.filter(e=>e.event_date===d&&e.space_ids.includes(s)&&!['Rejected','Cancelled'].includes(e.request_status)&&Number(e.start_time.slice(0,2))<=h&&Number(e.end_time.slice(0,2))>h);inner+='<div class="slot">'+es.map(e=>chip(e,i)).join('')+'</div>'})}inner+='</div></div></div>'}
if(managerTab==='detail'){const e=events.find(x=>x.id===selectedEvent);if(!e){managerTab='events';managerPage();return}inner='<div class="card"><button class="outline" id="backToEvents">← '+t('all')+'</button><h2>'+htmlEscape(e.event_name)+'</h2><div class="cols"><label class="field">'+t('requestStatus')+'<select id="reqStatus">'+STATUS.map(s=>'<option '+(s===e.request_status?'selected':'')+'>'+s+'</option>').join('')+'</select></label><label class="field">'+t('operationalStatus')+'<select id="opStatus">'+OPS.map(s=>'<option '+(s===e.operational_status?'selected':'')+'>'+s+'</option>').join('')+'</select></label><label class="field all">'+t('notes')+'<textarea id="managerNotes">'+htmlEscape(e.manager_notes||'')+'</textarea></label><div class="all"><button class="primary" id="saveEvent">'+t('save')+'</button></div></div><h2>Detalhes</h2><div class="summary">'+Object.entries({[t('reference')]:e.reference,[t('event')]:e.event_name,[t('requester')]:e.requester_name,[t('email')]:e.requester_email,[t('company')]:e.company_unit,[t('date')]:fmt(e.event_date),[t('spaces')]:e.space_ids.join(', '),[t('setupDate')]:fmt(e.setup_date),[t('teardownDate')]:fmt(e.teardown_date),[t('agency')]:optionText(e.agency),[t('needs')]:e.needs.join(', '),[t('details')]:e.event_description,[t('avtitle')]:JSON.stringify(e.av_brief)}).map(([k,v])=>'<b>'+htmlEscape(k)+':</b> '+htmlEscape(v||'—')+'<br>').join('')+'</div><h3>'+t('history')+'</h3><div id="history"></div></div>'}
app.innerHTML='<h1>Vision Center Management</h1><p>'+t('protected')+'</p>'+nav+inner;
document.querySelectorAll('[data-tab]').forEach(n=>n.onclick=()=>{managerTab=n.dataset.tab;managerPage()});document.querySelectorAll('[data-open]').forEach(n=>n.onclick=()=>{selectedEvent=n.dataset.open;managerTab='detail';managerPage()});document.getElementById('logout').onclick=()=>{accessCode='';isManager=false;events=[];render()};
if(managerTab==='events'){const filter=()=>{let q=document.getElementById('filterText').value.toLowerCase(),s=document.getElementById('filterStatus').value;document.getElementById('eventResults').innerHTML=eventTable(events.filter(e=>(e.event_name+' '+e.requester_name+' '+(e.company_unit||'')).toLowerCase().includes(q)&&(!s||e.request_status===s)));document.querySelectorAll('[data-open]').forEach(n=>n.onclick=()=>{selectedEvent=n.dataset.open;managerTab='detail';managerPage()})};document.getElementById('filterText').oninput=filter;document.getElementById('filterStatus').onchange=filter}
if(managerTab==='calendar'){document.getElementById('mPrev').onclick=()=>{month.setMonth(month.getMonth()-1);managerPage()};document.getElementById('mNext').onclick=()=>{month.setMonth(month.getMonth()+1);managerPage()};document.querySelectorAll('[data-day]').forEach(n=>n.onclick=()=>{selected=n.dataset.day;managerTab='schedule';managerPage()})}
if(managerTab==='schedule')document.getElementById('scheduleDate').onchange=e=>{selected=e.target.value;managerPage()};
if(managerTab==='detail'){document.getElementById('backToEvents').onclick=()=>{managerTab='events';managerPage()};document.getElementById('saveEvent').onclick=saveManagerEvent;db.rpc('vc_management_history',{p_code:accessCode,p_event_id:selectedEvent}).then(({data})=>{const n=document.getElementById('history');if(n)n.innerHTML=(data||[]).map(x=>'<p>'+htmlEscape(x.changed_at)+' — '+htmlEscape((x.previous_request_status||'')+' → '+x.new_request_status)+'</p>').join('')||'<p>—</p>'})}}
async function saveManagerEvent(){const e=events.find(x=>x.id===selectedEvent),s=document.getElementById('reqStatus').value,op=document.getElementById('opStatus').value,notes=document.getElementById('managerNotes').value;if(s!=='Confirmed'&&op!=='Not started')return alert('Somente eventos confirmados podem avançar para execução.');const {data,error}=await db.rpc('vc_management_update',{p_code:accessCode,p_event_id:e.id,p_request_status:s,p_operational_status:op,p_notes:notes});if(error||data!==true)return alert(error?.message||t('error'));await loadEvents();managerPage()}
async function render(){document.getElementById('requestLink').textContent=t('request');document.getElementById('adminLink').textContent=t('admin');if(page==='admin'){if(isManager)await loadEvents();managerPage()}else requestPage()}
render();
</script></body></html>
